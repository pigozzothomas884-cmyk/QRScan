name: Build Windows Installer & Portable

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Packages (MSI & Portable ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR package with Maven
        run: mvn clean verify

      - name: Build Standalone App, MSI Installer & Portable ZIP
        shell: powershell
        run: .\packaging\build-installer.ps1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QRScan-Windows-Packages
          path: |
            dist/*.msi
            dist/*.zip
            dist/*.exe
          if-no-files-found: warn

      - name: Create Release on GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.msi
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
